<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 130" width="780" height="130" role="img" aria-label="A'Tipik processing pipeline">
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#221634"/><stop offset="1" stop-color="#170F26"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A77BD8"/></marker>
  </defs>
  <rect width="780" height="130" fill="#0B0712"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-rendering="geometricPrecision">
    <rect x="10" y="40" width="150" height="50" rx="10" fill="url(#b1)" stroke="#5E1FA8"/>
    <text x="85" y="62" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Capture</text>
    <text x="85" y="80" fill="#CFC1DE" font-size="11" text-anchor="middle">frame / selection</text>
    <line x1="160" y1="65" x2="195" y2="65" stroke="#A77BD8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="200" y="40" width="160" height="50" rx="10" fill="url(#b1)" stroke="#5E1FA8" stroke-dasharray="5 3"/>
    <text x="280" y="62" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Tone filter</text>
    <text x="280" y="80" fill="#CFC1DE" font-size="11" text-anchor="middle">optional, instant</text>
    <line x1="360" y1="65" x2="395" y2="65" stroke="#A77BD8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="400" y="40" width="170" height="50" rx="10" fill="url(#b1)" stroke="#5E1FA8" stroke-dasharray="5 3"/>
    <text x="485" y="62" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Textualiser</text>
    <text x="485" y="80" fill="#CFC1DE" font-size="11" text-anchor="middle">optional, local LLM</text>
    <line x1="570" y1="65" x2="605" y2="65" stroke="#A77BD8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="610" y="40" width="160" height="50" rx="10" fill="url(#b1)" stroke="#45D6C5"/>
    <text x="690" y="62" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Kinetic injection</text>
    <text x="690" y="80" fill="#D8C5F0" font-size="11" text-anchor="middle">human-like timing</text>
    <text x="390" y="118" fill="#7C6B96" font-size="11" text-anchor="middle">nothing leaves the machine</text>
  </g>
</svg>
